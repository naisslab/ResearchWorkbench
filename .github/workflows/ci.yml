name: Mac CI
on:
  push:
    branches: [main, master, "codex/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install TeX test tools
        run: bash .github/scripts/install-tex.sh
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run test:release-ui
      - run: npm run test:portfolio-ui
      - name: Build development app
        run: npm run package
      - name: Verify development package
        run: npm run check:release -- --artifacts --development
      - name: Test a packaged fresh installation
        run: npm run test:packaged-ui
      - name: Preserve failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failures-${{ matrix.runner }}
          path: output/playwright/
          if-no-files-found: ignore
